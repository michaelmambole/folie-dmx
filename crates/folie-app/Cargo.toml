[package]
name = "folie-app"
description = "Interface graphique de Folie-DMX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "folie-dmx"
path = "src/main.rs"

[dependencies]
folie-control.workspace = true
folie-dmx.workspace = true
folie-engine.workspace = true
folie-fixture.workspace = true
folie-show.workspace = true
folie-remote.workspace = true
folie-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd = "0.17"
dirs = "7"
display-info = "0.5"
qrcodegen = "1.8"
if-addrs = "0.15"
eframe = "0.37"
log.workspace = true
env_logger.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
tempfile = "3"
tungstenite = "0.28"
rosc = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
