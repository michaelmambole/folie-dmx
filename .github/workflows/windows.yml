# Compile Folie-DMX pour Windows à chaque push : l'exécutable se télécharge
# depuis l'onglet Actions du dépôt (section « Artifacts » du passage).
name: Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilation
        run: cargo build --release --bin folie-dmx --bin folie

      - name: Tests (hors interface)
        run: cargo test --workspace --exclude folie-app

      - name: Paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Folie-DMX | Out-Null
          Copy-Item target/release/folie-dmx.exe, target/release/folie.exe, LICENSE, README.md Folie-DMX/
          Copy-Item -Recurse library Folie-DMX/library

      - uses: actions/upload-artifact@v4
        with:
          name: Folie-DMX-windows
          path: Folie-DMX
